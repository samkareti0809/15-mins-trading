name: Automated Momentum Trading Pipeline

on:
  schedule:
    # Runs every 15 minutes Monday-Friday during market hours
    - cron: '*/15 3-10 * * 1-5'

  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests pytz

      - name: Run Momentum Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python momentum_bot.py

      - name: Commit and Push Updated Cache Database
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum_cache.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update momentum cache DB [skip ci]" && git push)
