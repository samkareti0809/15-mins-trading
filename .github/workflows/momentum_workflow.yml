name: Automated Momentum Trading Pipeline

on:
  schedule:
    # Runs every 15 minutes Monday-Friday during market hours
    - cron: '*/15 3-10 * * 1-5'

  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests pytz

      - name: Run Momentum Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python momentum_bot.py

      - name: Commit and Push Updated Cache Database
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum_cache.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update momentum cache DB [skip ci]" && git push)
          
          if __name__ == "__main__":
          from datetime import datetime, timezone, timedelta
          
          stock_universe = ["CUPID.NS", "SCHNEIDER.NS", "MAZDOCK.NS", "COCHINSHIP.NS", "HAL.NS", "BEL.NS", "TITAN.NS"]
          
          # Check if a mode was passed manually, otherwise auto-detect based on IST time
          if len(sys.argv) > 1:
              mode = sys.argv[1]
          else:
              # Define IST timezone (UTC + 5:30)
              IST = timezone(timedelta(hours=5, minutes=30))
              now_ist = datetime.now(IST)
              
              current_hour = now_ist.hour
              current_minute = now_ist.minute
              
              print(f"Current IST Time: {now_ist.strftime('%Y-%m-%d %H:%M:%S')}")
              
              # Pre-market window: Run between 8:40 AM and 9:00 AM IST
              if current_hour == 8 and 40 <= current_minute <= 59:
                  mode = "premarket"
              else:
                  mode = "monitor"
                  
          print(f"Executing mode: {mode}")
          
          if mode == "premarket":
              run_premarket(stock_universe)
          elif mode == "monitor":
              init_database()  # Ensure table exists before monitoring
              run_monitor()
