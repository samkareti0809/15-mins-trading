name: Automated Momentum Trading Pipeline

on:
  schedule:
    # 1. Pre-Market Screener runs every Monday-Friday at 3:15 AM UTC (8:45 AM IST)
    - cron: '15 3 * * 1-5'
    
    # 2. Intraday Monitor runs every 15 minutes Monday-Friday between 3:45 AM - 10:00 AM UTC (9:15 AM - 3:30 PM IST)
    - cron: '*/15 3-10 * * 1-5'

  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Required to commit SQLite cache back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance requests

      - name: Determine Mode and Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Determine if triggered by pre-market cron or intraday cron/manual
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_MIN=$(date -u +%M)
          
          # If time is around 3:15 UTC, run premarket; otherwise run monitor
          if [ "\(CURRENT_HOUR" -eq 3 ] && [ "\)CURRENT_MIN" -ge 15 ] && [ "$CURRENT_MIN" -le 30 ]; then
            echo "Running Pre-Market Screener..."
            python momentum_bot.py premarket
          else
            echo "Running 15-Minute Intraday Monitor..."
            python momentum_bot.py monitor
          fi

      - name: Commit and Push Updated Cache Database
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add momentum_cache.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update momentum cache DB [skip ci]" && git push)
